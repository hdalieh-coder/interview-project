<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flickz</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/0af1ea0883.js" crossorigin="anonymous"></script>
    <script src="index.js"></script>
</head>
<body>
    <div id="app">
        <div class="flex flex-col">
            <header class="navbar">
                <div class="nav content-wrapper justify-between align-center">
                    <div class="logo">
                        <img src="./assets/Copilot_20260826_215651.png" alt="flickz logo" class="logo">
                    </div>
                    <div class="links align-center justify-between">
                        <a href="" class="link router-link-exact-active router-link-active">Home</a>
                        <a href="" class="link">Find your film</a>
                        <a class="btn-contact">Contact</a>
                    </div>
                </div>
            </header>
            <section id="landing-page">
                <div class="content-wrapper flex-col align-center justify-between">
                    <div class="flex flex-col align-center">
                        <div style="width: 100%;">
                            <div style="animation-duration: 1500ms; transition-duration: 1500ms; animation-delay: 300ms; transition-delay: 300ms; width: 100%;">
                                <h1>America's favorite go to source for movie content</h1>
                            </div>
                        </div>
                        <div style="width: 100%;">
                            <div style="animation-duration: 1500ms; transition-duration: 1500ms; animation-delay: 600ms; transition-delay: 600ms; width: 100%;">
                                <h2>Find your favorite film with <span class="purple">Flickz</span></h2>
                            </div>
                        </div>
                        <div style="width: 100%;">
                            <div style="animation-duration: 1500ms; transition-duration: 1500ms; animation-delay: 1100ms; transition-delay: 1100ms; width: 100;">
                                <div class="input-wrapper">
                                    <input type="text">
                                    <button class="not-loading">
                                        <svg>
                                            <path></path>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <img src="./assets/undraw_home-cinema_jdm1.svg" alt="home-cinema" class="home-cinema">
                    <div class="popcorn-wrapper">
                        <div></div>
                        <div></div>
                        <div></div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</body>
</html>
